# Alembic configuration.
#
# The database URL is intentionally NOT set here — `alembic/env.py` reads it from
# the application settings (env var DATABASE_URL) so migrations and the app can
# never disagree about which database they target.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migration filenames: 0001_slug.py, 0002_slug.py — sortable, readable in `ls`.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Keep autogenerate output tidy.
truncate_slug_length = 40

[post_write_hooks]
# Format every generated migration with ruff so they match house style.
# `module` (not `exec`) runs ruff via the active interpreter, so it works
# whether ruff is on PATH or only in the project venv.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
