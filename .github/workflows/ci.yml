# Continuous integration: lint + test the backend, sanity-check the frontend.
#
# Runs on every push and pull request. A real PostgreSQL service (not SQLite)
# backs the backend job because the schema leans on Postgres-specific features
# (full-text search, citext, generated columns, partial indexes) that a SQLite
# fallback couldn't validate — see backend/tests/conftest.py.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://jobhub:jobhub@localhost:5432/jobhub
      JWT_SECRET: ci-only-secret-not-used-anywhere-real-0000000000000000
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every module
        run: |
          status=0
          while IFS= read -r -d '' f; do
            node --check "$f" || status=1
          done < <(find js -name '*.js' -print0)
          exit $status

      - name: Install Tailwind and build CSS
        run: |
          npm install
          npm run build
