<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job — JobHub</title>
    <meta name="jobhub:api-base" content="{{API_BASE_URL}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body class="min-h-screen">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="index.html" class="flex items-center gap-2 text-lg font-bold text-ink-900">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-500 text-white">J</span>
          JobHub
        </a>
        <nav class="flex items-center gap-2 text-sm">
          <a href="saved.html" class="btn-ghost hidden sm:inline-flex">Saved jobs</a>
          <span id="auth-nav"></span>
          <a href="employer.html" class="btn-primary">Post a job</a>
        </nav>
      </div>
    </header>

    <main class="px-4 py-8">
      <div id="job-root">
        <div class="mx-auto max-w-3xl animate-pulse space-y-4">
          <div class="h-6 w-2/3 rounded bg-slate-200"></div>
          <div class="h-4 w-1/3 rounded bg-slate-200"></div>
          <div class="h-40 rounded-card bg-slate-200"></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { initJobDetailPage } from "./js/pages/jobDetailPage.js";
      import { mountAuthNav } from "./js/components/authNav.js";
      mountAuthNav(document.getElementById("auth-nav"));
      initJobDetailPage();
    </script>
  </body>
</html>
